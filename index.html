<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do app</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

<body>
    <div class="container shadow p-5 m-5 rounded m-auto mt-5">
        <div class="col">
            <h1>To-do app
                <small class="text-body-secondary">Organize your life</small>
            </h1>
            <form id="taskForm" class="row my-4">
                <div class="col-auto">
                    <input type="text" id="taskInput" placeholder="Add a new task" class="form-control">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-outline-primary">Add task</button>
                </div>
            </form>
            <ul id="taskList" class="list-group">
            </ul>
        </div>
    </div>
    <script defer src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
